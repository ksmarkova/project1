name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile C++ to EXE
        run: g++ -std=c++17 *.cpp -o shop.exe -static
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: shop-windows
          path: shop.exe
